stages:
  download:
    cmd: python src/download.py --output data/raw
    deps:
      - src/download.py
    params:
      - download.ticker
      - download.forms
      - download.after
      - download.before
    outs:
      - data/raw
 
  render:
    cmd: python src/render.py --input data/raw --output data/rendered
    deps:
      - src/render.py
      - data/raw
    params:
      - download.ticker
      - render.page_format
    outs:
      - data/rendered
 
  parse_pdfplumber:
    cmd: python src/parse_text.py --input data/rendered --output data/parsed
    deps:
      - src/parse_text.py
      - data/rendered
      - src/managed/fallback.py
      - src/managed/textract.py
      - src/managed/cache.py
      - src/managed/blocks.py
      - data/managed
    params:
      - text
      - ocr
      - managed
    outs:
      - data/parsed

  tables:
    cmd: python src/tables.py --input data/rendered --output data/tables
    deps:
      - src/tables.py
      - data/rendered
    params:
      - tables
    outs:
      - data/tables

  parse_docling:
    cmd: python -m src.docling_parse --input data/rendered --output data/docling --raw data/raw
    deps:
      - src/docling_parse.py
      - data/rendered
      - data/raw
    params:
      - docling
    outs:
      - data/docling

  layout:
    cmd: python src/layout.py --input data/rendered --output data/layout --figures data/figures
    deps:
      - src/layout.py
      - src/tables.py
      - data/rendered
    params:
      - layout
      - tables
      - ocr.dpi
    outs:
      - data/layout
      - data/figures

  export:
    cmd: python -m src.export --layout data/layout --parsed data/parsed --rendered data/rendered --raw data/raw --output data/export
    deps:
      - src/export.py
      - src/schema.py
      - src/tables.py
      - src/managed/fallback.py
      - src/managed/textract.py
      - src/managed/cache.py
      - src/managed/blocks.py
      - data/layout
      - data/parsed
      - data/rendered
      - data/raw
      - data/managed
    params:
      - tables
      - export
      - managed
    outs:
      - data/export

  xbrl:
    cmd: python src/xbrl.py
    deps:
      - src/xbrl.py
      - src/evaluate.py
      - src/tables.py
      - config/label_map.yaml
      - data/raw
      - data/rendered
      - data/tables
      - data/docling
      - data/parsed
    params:
      - xbrl
      - tables
    outs:
      - data/xbrl

  evaluate:
    cmd: >-
      python src/evaluate.py --out reports
      --fixtures-gt tests/fixtures/gt --fixtures-parsed data/fixtures/parsed
      --fixtures-layout data/fixtures/layout --fixtures-docling data/fixtures/docling
    deps:
      - src/evaluate.py
      - src/tables.py
      - data/ground_truth
      - data/parsed
      - data/layout
      - data/docling
      - data/tables
      - tests/fixtures/gt
      - data/fixtures
    metrics:
      - reports/metrics.json:
          cache: false
    outs:
      - reports/eval_pages.csv:
          cache: false
      - reports/eval_tables.csv:
          cache: false

  parse_fixtures:
    cmd: >-
      python src/parse_text.py --input tests/fixtures --output data/fixtures/parsed &&
      python src/layout.py --input tests/fixtures --output data/fixtures/layout --figures data/fixtures/figures &&
      python -m src.docling_parse --input tests/fixtures --output data/fixtures/docling --raw tests/fixtures/no_raw --manifest tests/fixtures/manifest_fixtures.csv
    deps:
      - src/parse_text.py
      - src/layout.py
      - src/tables.py
      - src/docling_parse.py
      - tests/fixtures/scanned.pdf
      - tests/fixtures/multicol.pdf
      - tests/fixtures/statement.pdf
      - tests/fixtures/manifest_fixtures.csv
    params:
      - text
      - ocr
      - layout
      - tables
      - docling
    outs:
      - data/fixtures

  ingest_comps:
    cmd: python -m src.ingest.comps --output data/edgar_comps
    deps:
      - src/ingest/__init__.py
      - src/ingest/edgar.py
      - src/ingest/runstats.py
      - src/ingest/comps.py
      - src/download.py
      - src/xbrl.py
      - src/evaluate.py
      - src/tables.py
      - src/docling_parse.py
      - src/export.py
    params:
      - comps.tickers
      - comps.forms
      - comps.after
      - comps.before
      - docling
      - export.item_heading_max_chars
      - download.user_agent_name
      - download.user_agent_email
    outs:
      - data/edgar_comps
      
  ingest_earnings:
    cmd: python -m src.ingest.earnings --output data/earnings
    deps:
      - src/ingest/__init__.py
      - src/ingest/edgar.py
      - src/ingest/runstats.py
      - src/ingest/earnings.py
    params:
      - comps.tickers
      - comps.before
      - comps.earnings_8k_quarters
      - comps.earnings_8k_min_gap_days
      - download.user_agent_name
      - download.user_agent_email
    outs:
      - data/earnings

  ingest_dataroom:
    # Kestrel only until deal_a/deal_b are generated; then list them in --deals, deps and outs
    cmd: python -m src.ingest.dataroom --root data/dataroom --deals kestrel
    deps:
      - src/ingest/__init__.py
      - src/ingest/dataroom.py
      - src/ingest/records.py
      - src/ingest/runstats.py
      - src/parse_text.py
      - src/layout.py
      - src/tables.py
      - src/docling_parse.py
      - src/managed/fallback.py
      - src/managed/textract.py
      - src/managed/cache.py
      - src/managed/blocks.py
      - data/managed
      - data/dataroom/variant.json
      - data/dataroom/kestrel/raw
    params:
      - ingest.dataroom_tiers
      - ingest.ocr_line_overlap
      - ingest.ocr_para_gap_ratio
      - text
      - ocr
      - managed
      - layout
      - tables
      - docling
    outs:
      - data/dataroom/kestrel/export

  facts:
    cmd: python -m src.facts.build --deals kestrel --out data/facts/facts.duckdb --log data/facts/build_log.json
    deps:
      - src/facts/__init__.py
      - src/facts/schema.py
      - src/facts/periods.py
      - src/facts/xbrl_read.py
      - src/facts/xlsx_read.py
      - src/facts/claims.py
      - src/facts/build.py
      - src/facts/vocab.py
      - src/ingest/runstats.py
      - src/llm/client.py
      - config/metrics_vocab.yaml
      - data/edgar_comps
      - data/arelle_cache
      - data/dataroom/kestrel/raw
      - data/dataroom/kestrel/export
      - data/llm_cache
    params:
      - comps.tickers
      - facts.fye_tolerance_days
      - facts.arelle_cache
      - llm.provider
      - llm.models.large
      - llm.temperature
      - budget.usd_cap_per_task
    outs:
      - data/facts/facts.duckdb
      - data/facts/build_log.json

  reconcile:
    cmd: >-
      python -m src.facts.reconcile --deals kestrel --db data/facts/facts.duckdb --out data/facts/discrepancies.jsonl &&
      python -m src.facts.reconcile_eval --deal kestrel --out reports/reconciliation.md
    deps:
      - src/facts/reconcile.py
      - src/facts/reconcile_eval.py
      - data/facts/facts.duckdb
      - data/facts/build_log.json
      - data/dataroom/kestrel/answer_key.yaml
      - data/dataroom/kestrel/export
    params:
      - reconcile.tolerance_rel
      - reconcile.high_gap_rel
    outs:
      - data/facts/discrepancies.jsonl
      - reports/reconciliation.md:
          cache: false

  chunk:
    cmd: python -m src.chunk --deals kestrel --out data/chunks
    deps:
      - src/chunk.py
      - config/metrics_vocab.yaml
      - data/tokenizer
      - data/edgar_comps
      - data/dataroom/kestrel/raw
      - data/dataroom/kestrel/export
    params:
      - chunk.grid
      - comps.tickers
    outs:
      - data/chunks

  embed:
    cmd: python -m src.index --chunks data/chunks --index data/index
    deps:
      - src/index.py
      - src/retrieve.py
      - src/llm/client.py
      - src/ingest/runstats.py
      - data/chunks
      - data/eval/qrels.jsonl
    params:
      - chunk.grid
      - llm.embed.hosted
      - llm.embed.open
      - llm.embed.open_revision
      - budget.usd_cap_total
    outs:
      - data/index
      - data/embed_cache:
          persist: true
  retrieval_eval:
    cmd: python -m src.retrieval_eval --qrels data/eval/qrels.jsonl --index data/index --out reports/retrieval_eval.json
    deps:
      - src/retrieval_eval.py
      - src/retrieve.py
      - src/index.py
      - src/llm/client.py
      - data/eval/qrels.jsonl
      - data/index
      - data/embed_cache
    params:
      - chunk.grid
      - llm.embed.hosted
      - llm.embed.open
      - llm.embed.open_revision
      - retrieval.hybrid
    metrics:
      - reports/retrieval_eval.json:
          cache: false
